# Для сервера (VPS). На своём компьютере этот файл не нужен — там start-mac.command.
services:
  backend:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/shop.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    # DOMAIN — ваш бесплатный адрес, например myvpn.duckdns.org (впишите в .env)
    command: caddy reverse-proxy --from ${DOMAIN} --to backend:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
